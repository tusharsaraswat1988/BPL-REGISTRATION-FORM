<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="100%" height="100%">
  <defs>
    <filter id="studio-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- White Rounded Background Card for perfect contrast on any theme -->
  <rect x="10" y="10" width="360" height="190" rx="20" ry="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" filter="url(#studio-shadow)" />

  <g transform="translate(48, 20)">
    <!-- Line 1: VNS -->
    <text x="0" y="52" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#0A0A0A" letter-spacing="2">VNS</text>
    
    <!-- Line 2: LIVE -->
    <text x="0" y="104" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#0A0A0A" letter-spacing="2">LIVE</text>
    
    <!-- Line 3: STUDIO -->
    <text x="0" y="156" font-family="'Outfit', 'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#E51A1A" letter-spacing="2">STUDIO</text>
  </g>
</svg>
