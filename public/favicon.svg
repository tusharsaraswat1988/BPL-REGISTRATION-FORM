<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B38" />
      <stop offset="50%" stop-color="#070D24" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="30%" stop-color="#FFB800" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Text Metallic Gold / White Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield / Squircle Shape -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="18" />
  
  <!-- Inner Subtle Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="8 6" />

  <!-- Cricket Ball Seam / Dynamic Swoosh Arc in background -->
  <path d="M 70 360 Q 256 460 442 360" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
  <path d="M 90 380 Q 256 470 422 380" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- Top Star Accent (Championship Star) -->
  <g transform="translate(256, 105) scale(0.9)" filter="url(#glow)">
    <polygon points="0,-35 10,-10 36,-10 16,6 23,32 0,16 -23,32 -16,6 -36,-10 -10,-10" fill="url(#goldGrad)" />
  </g>
  <!-- Mini side stars -->
  <g transform="translate(195, 115) scale(0.45)">
    <polygon points="0,-30 9,-9 31,-9 14,5 20,27 0,14 -20,27 -14,5 -31,-9 -9,-9" fill="#38BDF8" />
  </g>
  <g transform="translate(317, 115) scale(0.45)">
    <polygon points="0,-30 9,-9 31,-9 14,5 20,27 0,14 -20,27 -14,5 -31,-9 -9,-9" fill="#38BDF8" />
  </g>

  <!-- BPL Monogram / Text -->
  <g filter="url(#subtleShadow)">
    <text 
      x="256" 
      y="295" 
      font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Montserrat', 'Arial Black', sans-serif" 
      font-size="168" 
      font-weight="900" 
      letter-spacing="4"
      fill="url(#textGrad)" 
      stroke="#04091A"
      stroke-width="12"
      paint-order="stroke fill"
      text-anchor="middle"
    >BPL</text>
  </g>

  <!-- Sub-ribbon Banner text: KIDS CRICKET / PREMIER LEAGUE -->
  <g transform="translate(256, 350)">
    <rect x="-120" y="-20" width="240" height="32" rx="16" fill="#0E224D" stroke="#FFB800" stroke-width="2.5" />
    <text 
      x="0" 
      y="2" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Arial', sans-serif" 
      font-size="16" 
      font-weight="800" 
      letter-spacing="3.5" 
      fill="#FFB800" 
      text-anchor="middle" 
      dominant-baseline="central"
    >KIDS LEAGUE</text>
  </g>
</svg>